<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Электровоз — инженерные решения</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4fbf8;--panel:#fff;--panel2:#eaf6f1;--panel3:#dff2eb;--border:#d3e8e0;--border2:#b8d9cd;--text:#0e2a26;--muted:#5b7f76;--muted2:#7a9a90;--accent:#0e7c6b;--accent-dark:#0a6455;--price:#0e7c6b;--danger:#c0392b;--danger-dark:#962015;--warn:#a87400;--ok:#1e8e5a;--dark:#12201f;--dark-border:#2a4642;--dark-text:#e6f2ee;--dark-muted:#8fb0a8;--mint:#2bd9b0;--brass:#c9a227;--shadow:rgba(0,60,45,.08);}
html[data-theme="dark"]{--bg:#0e1a1a;--panel:#162625;--panel2:#1e3230;--panel3:#24403c;--border:#2a4642;--border2:#365a54;--text:#e6f2ee;--muted:#8fb0a8;--muted2:#6a8f86;--accent:#2bd9b0;--accent-dark:#17b898;--price:#2bd9b0;--danger:#ff6b81;--danger-dark:#c0392b;--warn:#e8b84a;--ok:#2ec77a;--dark:#0a1413;--dark-border:#1e3230;--dark-text:#e6f2ee;--dark-muted:#8fb0a8;--mint:#2bd9b0;--brass:#d4af37;--shadow:rgba(0,0,0,.25);}
*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
button{cursor:pointer;border:none;border-radius:6px;font-weight:bold;padding:8px 16px;font-size:13px;color:#fff;background:linear-gradient(180deg,#12987f,#0e7c6b);box-shadow:0 4px 0 #085a4d;font-family:inherit;transition:transform .05s,box-shadow .05s}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #085a4d}button:disabled{opacity:.5;cursor:not-allowed}
html[data-theme="dark"] button{color:#0e2a26;background:linear-gradient(180deg,#2bd9b0,#17b898);box-shadow:0 4px 0 #0a6455}
input,select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border2);padding:8px 10px;border-radius:6px;font-size:13px;font-family:inherit}
input:focus{outline:none;border-color:var(--accent)}
.dark{background:linear-gradient(180deg,#2a4a44,#1f3a35);color:#d8ebe6;box-shadow:0 4px 0 #122623}
.red{background:linear-gradient(180deg,#e05a4e,#c0392b);color:#fff;box-shadow:0 4px 0 #962015}
.small{padding:4px 10px;font-size:11px;box-shadow:0 3px 0 #085a4d}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--border2);box-shadow:none}
.ghost:hover{background:var(--panel2)}
.top{background:var(--dark);color:var(--dark-text);padding:16px 20px;border-bottom:1px solid var(--dark-border)}
.top-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:14px}
.logo{font-size:3.8rem;line-height:1;text-shadow:0 0 20px rgba(43,217,176,.45)}
h1{color:var(--mint);font-size:2rem;letter-spacing:3px;line-height:1.1}
.sub{color:var(--dark-muted);letter-spacing:4px;font-size:.7rem;margin-top:2px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.top .dark{background:linear-gradient(180deg,#1e3833,#162b27);color:#cfe8e0;box-shadow:0 3px 0 #0a1513;border:1px solid var(--dark-border)}
.theme-toggle{background:transparent;border:1px solid var(--dark-border);color:var(--dark-muted);box-shadow:none;padding:6px 10px;font-size:16px;border-radius:6px}
.container{max-width:1200px;margin:0 auto;padding:20px}
.loader{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px}
.loader-spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-error{background:var(--panel);border:1px solid var(--danger);border-radius:12px;padding:24px;text-align:center;max-width:600px;margin:40px auto}
.load-error h2{color:var(--danger);margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:var(--panel);padding:12px;border-radius:10px;border:1px solid var(--border);align-items:center;box-shadow:0 2px 8px var(--shadow)}
.bar #srch{flex:1;min-width:180px}
.result-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.result-bar b{color:var(--text);font-size:15px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;position:relative;display:flex;flex-direction:column;box-shadow:0 8px 24px var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .img-box{width:100%;height:160px;background:#fff;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img-box img{max-width:100%;max-height:100%;object-fit:contain}
.card .ico{font-size:48px}
.card .cat{color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:4px}
.card h3{font-size:14px;font-weight:400;margin:5px 0;color:var(--text);flex-grow:1}
.card .desc{font-size:11px;color:var(--muted);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{color:var(--price);font-size:18px;font-weight:700;margin:6px 0 2px}
.card .badges{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.badge{font-size:10px;background:var(--panel3);border:1px solid var(--border2);color:var(--muted);padding:2px 6px;border-radius:10px}
.badge.out{color:var(--danger);border-color:#f0b8b0;background:#fdecea}
.badge.low{color:var(--warn);border-color:#e8c58a;background:#fff7e6}
.card-actions{display:flex;gap:6px;margin-top:auto}
.card-actions button{flex:1;padding:8px;font-size:12px}
.empty{color:var(--muted);font-style:italic;padding:20px 0;font-size:14px;text-align:center}
.load-more-wrap{text-align:center;padding:16px 0}
#cart{background:var(--panel);border-radius:12px;padding:18px;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);margin-top:20px}
#cart h2{color:var(--accent);font-weight:400;margin-bottom:10px}
.ci{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;gap:10px;flex-wrap:wrap}
.ci .acts{display:flex;gap:4px;align-items:center}
.total{color:var(--price);font-size:20px;font-weight:700;margin:12px 0}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:var(--panel);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;font-size:13px;color:var(--text);box-shadow:0 4px 12px var(--shadow);animation:tin .2s}
.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
footer{background:var(--dark);color:var(--dark-muted);padding:24px;margin-top:40px;font-size:12px;text-align:center}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1>Электровоз</h1>
        <div class="sub">инженерные решения</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <button class="dark" onclick="scrollToCart()">🛒 <span id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main class="container">
  <div id="loader" class="loader"><div class="loader-spinner"></div><div>Загрузка...</div></div>
  <div id="loadError" class="load-error" style="display:none">
    <h2>Ошибка загрузки</h2>
    <p id="loadErrorMsg" style="color:var(--muted)"></p>
    <button class="ghost" onclick="location.reload()" style="margin-top:16px">Обновить</button>
  </div>

  <div id="shopContent" style="display:none">
    <div class="bar">
      <input type="text" id="srch" placeholder="Поиск по названию..." oninput="debouncedRender()">
      <button class="dark" onclick="resetF()">Сброс</button>
    </div>
    <div class="result-bar"><span>Найдено: <b id="resultCount">0</b></span></div>
    
    <div id="list"></div>
    <div id="notFound" class="empty" style="display:none">Ничего не найдено.</div>
    
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="ghost" onclick="loadMore()">Показать ещё</button>
    </div>

    <section id="cart">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>🛒 Корзина</h2>
        <button class="dark small" onclick="clearCart()">Очистить</button>
      </div>
      <div id="cartList"><div class="empty">Пусто</div></div>
      <div class="total" id="cartTotal">Итого: 0 ₽</div>
      <button onclick="alert('Заказ отправлен!')">Оформить заказ</button>
    </section>
  </div>
</main>

<footer><div>© 2026 Электровоз</div></footer>
<div id="toasts"></div>

<script>
var P = [], cart = [], currentPage = 1, pageSize = 24;
var COLLATOR = new Intl.Collator('ru');

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function money(n){ n=Number(n); if(!isFinite(n))n=0; return n.toLocaleString('ru-RU')+' ₽'; }
function norm(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').trim(); }
function loadJSON(k,d){ try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;} }
function saveJSON(k,v){ try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;} }

function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); saveJSON('theme',t); }
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); }
function toast(msg,kind){ var box=document.createElement('div'); box.className='toast'+(kind?' '+kind:''); box.textContent=msg; $('toasts').appendChild(box); setTimeout(function(){ box.style.transition='opacity .3s'; box.style.opacity='0'; setTimeout(function(){box.remove();},350); },3200); }

// ============ ЗАГРУЗКА ДАННЫХ ============
async function fetchJSON(url){ var r = await fetch(url, {cache:'no-cache'}); if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function fetchArrayBuffer(url){ var r = await fetch(url, {cache:'no-cache'}); if (!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); }

async function loadData(){
  var catalog, excelBuffer;
  try {
    var r = await Promise.all([
      fetchJSON('catalog.json').catch(()=>[]), // Если нет каталога — пустой массив
      fetchArrayBuffer('Остатки товаров.xlsx').catch(()=>fetchArrayBuffer('остатки товаров.xlsx'))
    ]);
    catalog = r[0]; excelBuffer = r[1];
  } catch(e){ throw new Error('Не найден файл "Остатки товаров.xlsx" или "catalog.json".'); }

  // 1. Читаем остатки из Excel
  var stockMap = {};
  if (excelBuffer) {
    var workbook = XLSX.read(excelBuffer, {type: 'array'});
    var worksheet = workbook.Sheets[workbook.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ''});
    
    var nameCol = 0, qtyCol = 2, startRow = 0;
    for (var i = 0; i < Math.min(rows.length, 10); i++) {
      for (var j = 0; j < rows[i].length; j++) {
        var txt = String(rows[i][j]).toLowerCase();
        if (txt.includes('товар') || txt.includes('наименование')) nameCol = j;
        if (txt.includes('кол-во') || txt.includes('количество')) qtyCol = j;
      }
      if (nameCol !== 0 || qtyCol !== 2) { startRow = i + 1; break; }
    }

    for (var i = startRow; i < rows.length; i++) {
      var row = rows[i];
      if (!row || row.length <= Math.max(nameCol, qtyCol)) continue;
      var name = String(row[nameCol]).trim().toLowerCase();
      var qty = parseInt(String(row[qtyCol]).replace(/\s/g, '')) || 0;
      if (name) stockMap[name] = qty;
    }
  }

  // 2. Собираем карточки
  var products = Array.isArray(catalog) ? catalog : (catalog.products || []);
  
  if (products.length > 0) {
    // Берем данные из catalog.json, а остатки — из Excel
    P = products.map(function(p){
      var nameKey = (p.name || '').toLowerCase().trim();
      return {
        id: p.id,
        n: p.name || 'Без названия',
        desc: p.description || '',
        image: p.image || '',
        price: Number(p.price) || 0,
        unit: p.unit || 'шт',
        sku: p.sku || '',
        brand: p.brand || '',
        c: p.category || 'Товары',
        b: p.brand || '',
        stock: stockMap[nameKey] !== undefined ? stockMap[nameKey] : 0,
        _search: norm((p.name||'') + ' ' + (p.brand||'') + ' ' + (p.sku||''))
      };
    });
  } else {
    // Если catalog.json пуст, делаем карточки прямо из Excel
    P = [];
    var id = 1;
    for (var key in stockMap) {
      P.push({
        id: id++, n: key.charAt(0).toUpperCase() + key.slice(1), desc: '', image: '',
        price: 0, unit: 'шт', sku: '', brand: '', c: 'Товары', b: '',
        stock: stockMap[key], _search: norm(key)
      });
    }
  }
}

// ============ РЕНДЕР ============
var renderTimer = null;
function debouncedRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(function(){ currentPage=1; render(); },250); }

function getFiltered(){
  var s = norm($('srch').value);
  return P.filter(function(x){ return !s || x._search.indexOf(s) > -1; });
}

function render(){
  if(!P.length) return;
  var list = getFiltered();
  var total = list.length;
  var visible = list.slice(0, currentPage * pageSize);
  var h = '';

  visible.forEach(function(x){
    var stockCls = x.stock===0?'out':(x.stock<20?'low':'');
    var stockLbl = x.stock===0?'Нет':(x.stock<20?'Мало: '+x.stock:'В наличии');
    
    // Блок картинки
    var imgHtml = x.image 
      ? '<img src="'+esc(x.image)+'" alt="'+esc(x.n)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'
      : '';
    var iconHtml = '<div class="ico" style="display:'+(x.image?'none':'block')+'">📦</div>';

    h += '<div class="card">'+
      '<div class="badges"><span class="badge '+stockCls+'">'+esc(stockLbl)+'</span></div>'+
      '<div class="img-box">'+imgHtml+iconHtml+'</div>'+
      '<div class="cat">'+esc(x.c)+'</div>'+
      '<h3>'+esc(x.n)+'</h3>'+
      (x.desc ? '<div class="desc">'+esc(x.desc)+'</div>' : '<div style="height:4px"></div>')+
      '<div class="price">'+(x.price > 0 ? money(x.price) : 'По запросу')+'</div>'+
      '<div class="unit-price" style="font-size:11px;color:var(--muted);margin-bottom:8px">за 1 '+esc(x.unit)+'</div>'+
      '<div class="card-actions">'+
        '<button onclick="addCart('+x.id+')" '+(x.stock===0?'disabled':'')+'>'+(x.stock===0?'Нет':'В корзину')+'</button>'+
      '</div></div>';
  });
  
  $('list').innerHTML = h;
  $('notFound').style.display = total?'none':'block';
  $('resultCount').textContent = total;
  var shown = Math.min(currentPage*pageSize, total);
  $('loadMoreWrap').style.display = shown<total?'block':'none';
  updateBadges();
}

function loadMore(){ currentPage++; render(); }
function resetF(){ $('srch').value=''; currentPage=1; render(); }
function updateBadges(){ var n = cart.reduce(function(a,x){return a+(x.qty||0);},0); $('cartCount').textContent = n; }

// ============ КОРЗИНА ============
function addCart(id){
  var p = P.find(function(x){return x.id===id}); if(!p) return;
  var cur = cart.find(function(x){return x.id===id});
  if(cur){ 
    if(cur.qty + 1 > p.stock) { toast('Больше нет', 'err'); return; }
    cur.qty++; 
  } else {
    if(p.stock === 0) return;
    cart.push({id:p.id, qty:1, n:p.n, unit:p.unit, price:p.price}); 
  }
  saveCart(); renderCart(); toast('Добавлено: '+p.n,'ok');
}

function saveCart(){ saveJSON('cart_guest', cart); }
function loadCart(){ cart = loadJSON('cart_guest', []); }

function renderCart(){
  var h = '';
  var total = 0;
  if(!cart.length) h = '<div class="empty">Пусто</div>';
  else cart.forEach(function(x){
    total += (x.price || 0) * x.qty;
    h += '<div class="ci"><span class="name">'+esc(x.n)+'</span><span class="acts">'+
      '<button class="dark small" onclick="decCart('+x.id+')">−</button>'+
      '<b style="min-width:40px;text-align:center">'+x.qty+'</b>'+
      '<button class="small" onclick="incCart('+x.id+')">+</button>'+
      '<span style="min-width:90px;text-align:right">'+(x.price > 0 ? money(x.price * x.qty) : 'По запросу')+'</span>'+
      '<button class="red small" onclick="delCart('+x.id+')">✕</button></span></div>';
  });
  $('cartList').innerHTML = h;
  $('cartTotal').textContent = 'Итого: ' + (total > 0 ? money(total) : 'По запросу');
  updateBadges();
}

function incCart(id){ var cur = cart.find(function(x){return x.id===id}); if(cur){ cur.qty++; saveCart(); renderCart(); } }
function decCart(id){ var i = cart.findIndex(function(x){return x.id===id}); if(i>-1){ if(cart[i].qty>1) cart[i].qty--; else cart.splice(i,1); saveCart(); renderCart(); } }
function delCart(id){ cart = cart.filter(function(x){return x.id!==id}); saveCart(); renderCart(); }
function clearCart(){ if(!cart.length) return; if(!confirm('Очистить корзину?')) return; cart=[]; saveCart(); renderCart(); }
function scrollToCart(){ $('cart').scrollIntoView({behavior:'smooth'}); }

// ============ СТАРТ ============
(async function init(){
  applyTheme(loadJSON('theme','light'));
  loadCart();
  renderCart();

  try { 
    await loadData(); 
    $('loader').style.display = 'none'; 
    $('shopContent').style.display = 'block'; 
    render(); 
  } catch(e){ 
    console.error(e); 
    $('loader').style.display = 'none'; 
    $('loadError').style.display = 'block'; 
    $('loadErrorMsg').textContent = e.message; 
  }
})();
</script>
</body>
</html>
